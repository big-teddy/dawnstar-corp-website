<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Dawnstar social card source</title>
    <style>
      @font-face {
        font-family: "DM Sans";
        src: url("/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 1000;
      }
      * { box-sizing: border-box; }
      body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #e7e3f1; color: #28232e; font-family: "DM Sans", sans-serif; }
      main { position: relative; width: 100%; height: 100%; padding: 40px 60px; overflow: hidden; }
      .wordmark { font-size: 46px; font-weight: 550; letter-spacing: -3px; }
      .eyebrow { margin: 49px 0 23px; font-size: 13px; font-weight: 550; letter-spacing: 2px; text-transform: uppercase; }
      h1 { margin: 0; font-size: 84px; line-height: 1; font-weight: 500; letter-spacing: -5px; }
      h1 span { display: block; font-size: 226px; line-height: 0.94; letter-spacing: -15px; }
      .note { position: absolute; left: 60px; bottom: 43px; margin: 0; font-size: 20px; letter-spacing: -0.4px; }
      .portrait { position: absolute; top: 40px; left: 646px; width: 510px; height: 650px; overflow: hidden; border-radius: 49% 49% 42% 42%; transform: rotate(8deg); }
      .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 27%; transform: scale(1.08); }
      .copy { position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <main>
      <div class="portrait"><img src="/images/hero-1200.webp" alt="A woman enjoying sunlight" width="1024" height="1536" /></div>
      <div class="copy">
        <div class="wordmark">dawnstar</div>
        <p class="eyebrow">An AI wellness company</p>
        <h1>A little more<span>you.</span></h1>
      </div>
      <p class="note">Building Wellyn. Your personal wellness AI.</p>
    </main>
  </body>
</html>
